      source: |
        import { UIPluginsApi } from '@sailpoint/api-client';
        import { Configuration } from '@sailpoint/api-client';

        const configuration = new Configuration();
        const apiInstance = new UIPluginsApi(configuration);
        const pluginInstanceId: string = '2c918086-7b5f-4b3e-8a1c-2d3e4f5a6b7c'; // string | UUID of the plugin instance (default to undefined)
        const file: Array<File> = /path/to/file.txt; // Array<File> | Repeatable form field. Send one part per file; use the part filename for the bundle-relative path (e.g. `assets/app.js`). (default to undefined)
