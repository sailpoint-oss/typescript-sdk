- path: /accounts/v1/bulk-classify
  method: POST
  xCodeSample:
    - lang: TypeScript
      label: SDK_tools/sdk/typescript/machine_account_classify/methods/machine-account-classify#send-bulk-classify-machine-accounts-v1
      source: |
        import { MachineAccountClassifyApi } from '@sailpoint/api-client';
        import { Configuration } from '@sailpoint/api-client';
        import { BulkClassifyMachineAccountsRequest } from '@sailpoint/api-client/dist/machine_account_classify/api';

        const configuration = new Configuration();
        const apiInstance = new MachineAccountClassifyApi(configuration);
        const bulkClassifyMachineAccountsRequest: BulkClassifyMachineAccountsRequest = {
  "ids" : [ "ef38f94347e94562b5bb8424a56397d8", "2c9180835d191a86015d28455b4a2329" ]
}; // BulkClassifyMachineAccountsRequest | 
        const classificationMode: string = 'forceMachine'; // 'default' | 'ignoreManual' | 'forceMachine' | 'forceHuman' | Specifies how the accounts should be classified.        default - uses criteria to classify account as machine or human, excludes accounts that were manually classified.       ignoreManual - like default, but includes accounts that were manually classified.       forceMachine - forces account to be classified as machine.       forceHuman - forces account to be classified as human. (optional) (default to 'default')
        const xSailPointExperimental: string = 'true'; // string | Use this header to enable this experimental API. (optional) (default to 'true')
        const result = await apiInstance.sendBulkClassifyMachineAccountsV1({ bulkClassifyMachineAccountsRequest: bulkClassifyMachineAccountsRequest });
        console.log(result);
- path: /accounts/v1/{id}/classify
  method: POST
  xCodeSample:
    - lang: TypeScript
      label: SDK_tools/sdk/typescript/machine_account_classify/methods/machine-account-classify#send-classify-machine-account-v1
      source: |
        import { MachineAccountClassifyApi } from '@sailpoint/api-client';
        import { Configuration } from '@sailpoint/api-client';

        const configuration = new Configuration();
        const apiInstance = new MachineAccountClassifyApi(configuration);
        const id: string = 'ef38f94347e94562b5bb8424a56397d8'; // string | Account ID. (default to undefined)
        const classificationMode: string = 'forceMachine'; // 'default' | 'ignoreManual' | 'forceMachine' | 'forceHuman' | Specifies how the accounts should be classified.        default - uses criteria to classify account as machine or human, excludes accounts that were manually classified.       ignoreManual - like default, but includes accounts that were manually classified.       forceMachine - forces account to be classified as machine.       forceHuman - forces account to be classified as human. (optional) (default to 'default')
        const xSailPointExperimental: string = 'true'; // string | Use this header to enable this experimental API. (optional) (default to 'true')
        const result = await apiInstance.sendClassifyMachineAccountV1({ id: id });
        console.log(result);
