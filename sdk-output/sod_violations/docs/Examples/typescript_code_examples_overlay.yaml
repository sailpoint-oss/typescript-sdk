- path: /violations/v1/{id}/reassign
  method: POST
  xCodeSample:
    - lang: TypeScript
      label: SDK_tools/sdk/typescript/sod_violations/methods/sod-violations#move-violation-v1
      source: |
        import { SODViolationsApi } from '@sailpoint/api-client';
        import { Configuration } from '@sailpoint/api-client';
        import { Violationreassigninput } from '@sailpoint/api-client/dist/sod_violations/api';

        const configuration = new Configuration();
        const apiInstance = new SODViolationsApi(configuration);
        const id: string = '3e078865-55ed-43cf-b83c-85c58d2016e6'; // string | The ID of the policy violation to fetch (default to undefined)
        const violationreassigninput: Violationreassigninput = {
  "comments" : "some comments about the reassignment",
  "reassignTo" : {
    "assigneeType" : "IDENTITY",
    "assigneeId" : "3e07886555ed43cfb83c85c58d2016e6"
  }
}; // Violationreassigninput | Data needed to reassign a Policy Violation
        const xSailPointExperimental: string = 'true'; // string | Use this header to enable this experimental API. (optional) (default to 'true')
        const result = await apiInstance.moveViolationV1({ id: id, violationreassigninput: violationreassigninput });
        console.log(result);
