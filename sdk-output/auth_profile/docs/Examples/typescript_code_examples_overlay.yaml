- path: /auth-profiles/v1/{id}
  method: PATCH
  xCodeSample:
    - lang: TypeScript
      label: SDK_tools/sdk/typescript/auth_profile/methods/auth-profile#patch-profile-config-v1
      source: |
        import { AuthProfileApi } from '/api-client';
        import { Configuration } from '/api-client';
        import { JsonPatchOperation } from '/api-client/dist/auth_profile/api';

        const configuration = new Configuration();
        const apiInstance = new AuthProfileApi(configuration);
        const id: string = '2c91808a7813090a017814121919ecca'; // string | ID of the Auth Profile to patch. (default to undefined)
        const jsonPatchOperation: Array<JsonPatchOperation> = {
  "op" : "replace",
  "path" : "/description",
  "value" : "New description"
}; // Array<JsonPatchOperation> | 
        const result = await apiInstance.patchProfileConfigV1({ id: id, jsonPatchOperation: jsonPatchOperation });
        console.log(result);
