- path: /capabilities/v1/{id}
  method: PATCH
  xCodeSample:
    - lang: TypeScript
      label: SDK_tools/sdk/typescript/capabilities/methods/capabilities#update-capability-v1
      source: |
        import { CapabilitiesApi } from '@sailpoint/api-client';
        import { Configuration } from '@sailpoint/api-client';
        import { JsonPatchOperation } from '@sailpoint/api-client/dist/capabilities/api';

        const configuration = new Configuration();
        const apiInstance = new CapabilitiesApi(configuration);
        const id: string = '9b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e'; // string | Capability ID. (default to undefined)
        const jsonPatchOperation: Array<JsonPatchOperation> = {
  "op" : "replace",
  "path" : "/description",
  "value" : "New description"
}; // Array<JsonPatchOperation> | A JSON of updated values [JSON Patch](https://tools.ietf.org/html/rfc6902) standard.
        const xSailPointExperimental: string = 'true'; // string | Use this header to enable this experimental API. (optional) (default to 'true')
        const result = await apiInstance.updateCapabilityV1({ id: id, jsonPatchOperation: jsonPatchOperation });
        console.log(result);
