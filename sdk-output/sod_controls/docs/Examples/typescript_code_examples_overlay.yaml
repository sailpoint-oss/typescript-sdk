- path: /controls/v1/{id}
  method: PUT
  xCodeSample:
    - lang: TypeScript
      label: SDK_tools/sdk/typescript/sod_controls/methods/sod-controls#put-control-v1
      source: |
        import { SODControlsApi } from 'sailpoint-api-client';
        import { Configuration } from 'sailpoint-api-client';
        import { Compensatingcontrolupdate } from 'sailpoint-api-client/dist/sod_controls/api';

        const configuration = new Configuration();
        const apiInstance = new SODControlsApi(configuration);
        const id: string = '3e078865-55ed-43cf-b83c-85c58d2016e6'; // string | The unique identifier of the Compensating Control to be updated. (default to undefined)
        const compensatingcontrolupdate: Compensatingcontrolupdate = {
  "owner" : {
    "id" : "3e07886555ed43cfb83c85c58d2016e6",
    "type" : "IDENTITY"
  },
  "name" : "a name",
  "description" : "a description",
  "secondaryOwners" : [ {
    "id" : "943a7c57da334d07ba2454bf7fcf144f",
    "type" : "GOVERNANCE_GROUP"
  } ],
  "action" : "Workflow",
  "expiration" : "20d",
  "type" : "Mitigation",
  "justificationRequired" : true,
  "workflowID" : "3e07886555ed43cfb83c85c58d2016e6"
}; // Compensatingcontrolupdate | Data needed to put a Compensating Control
        const xSailPointExperimental: string = 'true'; // string | Use this header to enable this experimental API. (optional) (default to 'true')
        const result = await apiInstance.putControlV1({ id: id, compensatingcontrolupdate: compensatingcontrolupdate });
        console.log(result);
