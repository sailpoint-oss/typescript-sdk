- path: /devices/v1/{id}
  method: PATCH
  xCodeSample:
    - lang: TypeScript
      label: SDK_tools/sdk/typescript/devices/methods/devices#update-device-v1
      source: |
        import { DevicesApi } from '@sailpoint/api-client';
        import { Configuration } from '@sailpoint/api-client';
        import { JsonPatchOperation } from '@sailpoint/api-client/dist/devices/api';

        const configuration = new Configuration();
        const apiInstance = new DevicesApi(configuration);
        const id: string = '5be33d3e-c54d-4ed7-af73-2380543e8283'; // string | Device ID. (default to undefined)
        const jsonPatchOperation: Array<JsonPatchOperation> = {
  "op" : "replace",
  "path" : "/description",
  "value" : "New description"
}; // Array<JsonPatchOperation> | A JSON of updated values [JSON Patch](https://tools.ietf.org/html/rfc6902) standard.
        const xSailPointExperimental: string = 'true'; // string | Use this header to enable this experimental API. (optional) (default to 'true')
        const result = await apiInstance.updateDeviceV1({ id: id, jsonPatchOperation: jsonPatchOperation });
        console.log(result);
