- path: /{path}
  method: DELETE
  xCodeSample:
    - lang: TypeScript
      label: SDK_tools/sdk/typescript/generic/methods/generic#generic-delete
      source: |
        import { GenericApi } from '@sailpoint/api-client';
        import { Configuration } from '@sailpoint/api-client';

        const configuration = new Configuration();
        const apiInstance = new GenericApi(configuration);
        const path: string = 'accounts/v1'; // string | API path relative to the tenant base URL, including the API version, for example `accounts/v1`, `sources/v1/2c9180835d2e5168015d32f890ca1581` or `sources/v2/2c9180835d2e5168015d32f890ca1581/provisioning-policies`. Use whichever version the endpoint has. A leading slash is optional. Slashes separate path segments, and the SDK URL-encodes each segment, so pass the segments unencoded. Anything after a `?` is sent as query parameters, for example `accounts/v1?detailLevel=SLIM`. (default to undefined)
        const xSailPointExperimental: string = 'true'; // string | Set this header to `true` to call an experimental API. The SDK configuration must also enable experimental APIs. (optional) (default to undefined)
        const result = await apiInstance.genericDelete({ path: path });
        console.log(result);
