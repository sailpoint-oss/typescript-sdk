- path: /credentials/v1/{id}
  method: PATCH
  xCodeSample:
    - lang: TypeScript
      label: SDK_tools/sdk/typescript/credentials/methods/credentials#update-credential-v1
      source: |
        import { CredentialsApi } from '@sailpoint/api-client';
        import { Configuration } from '@sailpoint/api-client';
        import { JsonPatchOperation } from '@sailpoint/api-client/dist/credentials/api';

        const configuration = new Configuration();
        const apiInstance = new CredentialsApi(configuration);
        const id: string = '3f8a2c1d-5b6e-4d7f-8a9b-0c1d2e3f4a5b'; // string | Credential ID. (default to undefined)
        const jsonPatchOperation: Array<JsonPatchOperation> = {
  "op" : "replace",
  "path" : "/description",
  "value" : "New description"
}; // Array<JsonPatchOperation> | A JSON of updated values [JSON Patch](https://tools.ietf.org/html/rfc6902) standard.
        const xSailPointExperimental: string = 'true'; // string | Use this header to enable this experimental API. (optional) (default to 'true')
        const result = await apiInstance.updateCredentialV1({ id: id, jsonPatchOperation: jsonPatchOperation });
        console.log(result);
