name: "Release TypeScript SDK"

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
      && format('Release TypeScript SDK v{0}', github.event.inputs.version)
      || 'Release TypeScript SDK (auto)'
  }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release (e.g. 2.0.0). Leave empty to auto-increment patch."
        required: false
  schedule:
    - cron: "0 8 * * 1-5"

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  check-changes:
    name: Check for spec changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Checkout SDK
        if: github.event_name == 'schedule'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout API Specs
        if: github.event_name == 'schedule'
        uses: actions/checkout@v6
        with:
          repository: sailpoint-oss/api-specs
          path: api-specs
          ref: main

      - name: Determine whether to proceed
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || echo "v0.0.0")
          TAG_DATE=$(git log -1 --format=%aI "$LATEST_TAG" 2>/dev/null || echo "1970-01-01")
          TAG_COMMIT=$(cd api-specs && git rev-list -1 --before="$TAG_DATE" HEAD 2>/dev/null || echo "")

          if [ -z "$TAG_COMMIT" ]; then
            echo "Could not find api-specs commit at tag date. Proceeding to be safe."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SPEC_CHANGES=$(cd api-specs && git diff --name-only "$TAG_COMMIT" HEAD -- 'idn/**/*.yaml' | wc -l)

          if [ "$SPEC_CHANGES" -eq 0 ]; then
            echo "No spec file changes since $LATEST_TAG ($TAG_DATE). Skipping release."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found $SPEC_CHANGES spec file(s) changed since $LATEST_TAG. Proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  resolve-version:
    name: Resolve and validate version
    needs: check-changes
    if: needs.check-changes.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # Validation is separated from publishing: the dispatch input is parsed here,
    # in a job that holds no release token and no tenant credentials. The release
    # job only ever receives a version string that already parsed.
    permissions:
      contents: read
    outputs:
      new: ${{ steps.version.outputs.new }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # The dispatch input is read from the environment, never interpolated into
          # this script, and must parse as MAJOR.MINOR.PATCH before it is used.
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION="${LATEST_TAG#v}"

          if [[ ! "$LATEST_VERSION" =~ $SEMVER_RE ]]; then
            echo "::error::Latest tag does not parse as MAJOR.MINOR.PATCH"
            exit 1
          fi

          echo "latest=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

          if [ -n "$INPUT_VERSION" ]; then
            NEW_VERSION="${INPUT_VERSION#v}"
            if [[ ! "$NEW_VERSION" =~ $SEMVER_RE ]]; then
              # The rejected value is deliberately not echoed: it is untrusted and
              # could otherwise be read back out of the log as a workflow command.
              echo "::error::Version input must be MAJOR.MINOR.PATCH (e.g. 2.0.0)"
              exit 1
            fi
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
            PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          function ver { printf "%03d%03d%03d%03d" $(echo "$1" | tr '.' ' '); }
          if [ "$(ver "$LATEST_VERSION")" -ge "$(ver "$NEW_VERSION")" ]; then
            echo "::error::New version $NEW_VERSION is not greater than current version $LATEST_VERSION"
            exit 1
          fi

          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $NEW_VERSION (previous: $LATEST_VERSION)"

  release:
    name: Release TypeScript SDK
    needs: [check-changes, resolve-version]
    if: needs.check-changes.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # Requires approval from the reviewers configured on the "release" environment
    # before any release credential reaches the runner.
    environment: release
    permissions:
      contents: write
    env:
      SAIL_CLIENT_ID: ${{ secrets.SDK_TEST_TENANT_CLIENT_ID }}
      SAIL_CLIENT_SECRET: ${{ secrets.SDK_TEST_TENANT_CLIENT_SECRET }}
      SAIL_BASE_URL: ${{ secrets.SDK_TEST_TENANT_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.DEVREL_SERVICE_TOKEN }}

      - name: Checkout API Specs
        uses: actions/checkout@v6
        with:
          repository: sailpoint-oss/api-specs
          path: api-specs
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up yq
        uses: frenck/action-setup-yq@c4b5be8b4a215c536a41d436757d9feb92836d4f # v1.0.2

      - name: Update config files with new version
        shell: bash
        run: |
          VERSION="${{ needs.resolve-version.outputs.new }}"
          yq -i ".npmVersion = \"$VERSION\"" sdk-resources/nerm-config.yaml
          yq -i ".npmVersion = \"$VERSION\"" sdk-resources/nerm-v2025-config.yaml
          sed -i "s/const NPM_VERSION = \"[^\"]*\"/const NPM_VERSION = \"$VERSION\"/" sdk-resources/build-versioned-sdk.js

      - name: Update package.json version
        shell: bash
        run: |
          cd sdk-output
          jq ".version = \"${{ needs.resolve-version.outputs.new }}\"" package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Build SDK
        uses: ./.github/actions/build-sdk

      - name: Commit changes and tag
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "Bump version to v${{ needs.resolve-version.outputs.new }}"
          tagging_message: "v${{ needs.resolve-version.outputs.new }}"
          commit_user_name: developer-relations-sp
          commit_user_email: devrel-service@sailpoint.com

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          token: ${{ secrets.DEVREL_SERVICE_TOKEN }}
          tag_name: "v${{ needs.resolve-version.outputs.new }}"
          name: "v${{ needs.resolve-version.outputs.new }}"
          draft: false
          prerelease: false
          generate_release_notes: true
