name: Publish SDK package to npmjs
on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # OIDC token for npm trusted publishing

    steps:
      - name: Verify default branch on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Read from the environment rather than interpolating: expressions resolve
          # before bash parses this step, so a ref name spliced into the script text
          # would be evaluated here -- in the job holding the npm publishing token.
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Error: manual publish must run from the default branch ($DEFAULT_BRANCH), got: $REF_NAME"
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
      - run: |
          cd sdk-output
          npm ci
      - run: npm publish --provenance
        working-directory: sdk-output
