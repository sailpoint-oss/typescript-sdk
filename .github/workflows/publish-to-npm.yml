name: Publish SDK package to npmjs
on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # OIDC token for npm trusted publishing

    steps:
      - name: Verify default branch on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then
            echo "Error: manual publish must run from the default branch (${{ github.event.repository.default_branch }}), got: ${{ github.ref_name }}"
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
      - run: |
          cd sdk-output
          npm ci
      - run: npm publish --provenance
        working-directory: sdk-output
